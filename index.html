<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4A5D4A" />
  <title>得闲茶吧 · 经营工作台</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="apple-touch-icon.png" alt="logo" class="brand-logo" />
        <div class="brand-text">
          <strong>得闲茶吧</strong>
          <span>经营工作台</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a class="nav-item active" data-page="overview"><i class="fa-regular fa-chart-pie"></i><span>总览</span></a>
        <a class="nav-item" data-page="expenses"><i class="fa-regular fa-credit-card"></i><span>支出管理</span></a>
        <a class="nav-item" data-page="income"><i class="fa-regular fa-sack-dollar"></i><span>收入管理</span></a>
        <a class="nav-item" data-page="upfront"><i class="fa-regular fa-hand-holding-dollar"></i><span>前期经费</span></a>
        <a class="nav-item" data-page="products"><i class="fa-regular fa-box"></i><span>产品管理</span></a>
        <a class="nav-item" data-page="pricing"><i class="fa-regular fa-tags"></i><span>定价策略</span></a>
        <a class="nav-item" data-page="marketing"><i class="fa-regular fa-bullhorn"></i><span>推广准备</span></a>
        <a class="nav-item" data-page="settings"><i class="fa-regular fa-gear"></i><span>设置</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="conn-badge" id="connBadge" data-state="local">
          <span class="dot"></span><span class="conn-text">仅本地</span>
        </div>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="菜单"><i class="fa-solid fa-bars"></i></button>
        <h1 class="page-title" id="pageTitle">总览</h1>
        <div class="topbar-right">
          <div class="conn-chip" id="connChip" data-state="local">
            <span class="dot"></span><span id="connChipText">未连接云端</span>
          </div>
        </div>
      </header>

      <div class="pages">
        <section class="page active" id="page-overview"></section>
        <section class="page" id="page-expenses"></section>
        <section class="page" id="page-income"></section>
        <section class="page" id="page-upfront"></section>
        <section class="page" id="page-products"></section>
        <section class="page" id="page-pricing"></section>
        <section class="page" id="page-marketing"></section>
        <section class="page" id="page-settings"></section>
      </div>
    </div>
  </div>

  <!-- 模态框容器 -->
  <div class="modal-root" id="modalRoot"></div>
  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
